# ─────────────────────────────────────────────────────────────────────────────
#  build-macos-dmg.yml
#  Builds the TaskFlow macOS installer (.dmg) and publishes it to a GitHub
#  Release so installed Mac copies can detect updates.
#
#  Mac auto-update caveat:
#    Without an Apple Developer ID ($99/yr) we can't sign / notarize the
#    app, so macOS refuses silent in-place upgrades. The app instead pops
#    a dialog when it detects a new release and opens the GitHub Releases
#    page in the user's default browser. The user downloads the new .dmg
#    and drags TaskFlow into Applications, replacing the old copy.
#
#  Triggers:
#    • Manually from GitHub → Actions tab → "Build & Publish macOS"
#    • Automatically when a commit lands on main that touches code paths
#      relevant to the desktop app.
#
#  How a release happens:
#    1. You bump "version" in package.json and push.
#    2. This workflow builds .dmg + .zip for both x64 and arm64.
#    3. electron-builder creates / updates GitHub release "vX.Y.Z" and
#       uploads all the assets + latest-mac.yml.
#    4. Installed Macs check the Releases endpoint, see the new version,
#       prompt the user to download.
#
#  Note on macOS runner minutes: GitHub's free tier counts macOS minutes
#  at 10× Linux (so 2000 free Linux min ≈ 200 macOS min). For a handful
#  of releases a month this is well within the free quota.
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Publish macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "src/**"
      - "vite.config.ts"
      - "index.html"

# electron-builder needs to create / update GitHub Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build & publish macOS .dmg + .zip to GitHub Releases
        run: npm run electron:publish:mac
        env:
          # Skip notarization / code-signing — no Apple Developer ID.
          # First-launch users right-click → Open, or allow in
          # System Settings → Privacy & Security.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Token used by electron-builder to talk to the GitHub Releases API.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
