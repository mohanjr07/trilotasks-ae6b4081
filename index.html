<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable phone app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Default theme: dark on phones and in the mobile apps, light on computers.
         The light/dark toggle choice is remembered on that device (theme-v2). -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme-v2"); } catch (e) {}
        var cap = window.Capacitor;
        var isApp = !!(cap && (cap.isNativePlatform ? cap.isNativePlatform() : cap.isNative));
        var isPhone = window.matchMedia && window.matchMedia("(max-width: 767.98px)").matches;
        var dark = (t === "dark" || t === "light") ? t === "dark" : (isApp || isPhone);
        if (dark) document.documentElement.classList.add("dark");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0a0f1b" : "#ffffff");
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TaskFlow" />

    <!-- App loading screen: Trilo emblem inside a spinning ring (also used by the app while signing in) -->
    <link rel="preload" as="image" href="/loader-emblem.png" />
    <style>
      .trilo-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #f7f6f3; }
      html.dark .trilo-loader { background: #0a0f1b; }
      .trilo-loader__box { position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center; }
      .trilo-loader__ring { position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(17,17,17,0) 0deg, rgba(17,17,17,.10) 120deg, rgba(17,17,17,.55) 250deg, #111 340deg, #111 352deg, rgba(17,17,17,0) 353deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 calc(100% - 12px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 calc(100% - 12px));
        animation: trilo-spin 1s linear infinite; }
      .trilo-loader__track { position: absolute; inset: 0; border-radius: 50%; border: 12px solid rgba(17,17,17,.06); }
      html.dark .trilo-loader__ring { background: conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.10) 120deg, rgba(255,255,255,.55) 250deg, #fff 340deg, #fff 352deg, rgba(255,255,255,0) 353deg); }
      html.dark .trilo-loader__track { border-color: rgba(255,255,255,.07); }
      .trilo-loader__logo { width: 64px; height: auto; animation: trilo-breathe 1.6s ease-in-out infinite; }
      .trilo-loader__text { font: 500 11px/1 system-ui, -apple-system, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: rgba(17,17,17,.45); }
      html.dark .trilo-loader__text { color: rgba(255,255,255,.5); }
      @keyframes trilo-spin { to { transform: rotate(360deg); } }
      @keyframes trilo-breathe { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { .trilo-loader__ring { animation-duration: 2.4s; } .trilo-loader__logo { animation: none; } }
    </style>
</head>

  <body>
    <div id="root">
      <!-- shown until the app starts (replaced by React) -->

        <div class="trilo-loader__text">Loading</div>
      </div>
    </div>
