<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TaskFlow — offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f8f7f4; color:#1a1a18; }
  @media (prefers-color-scheme: dark) { body { background:#111; color:#eee; } p { color:#aaa !important; } }
  .box { text-align:center; padding:24px; max-width:320px; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:20px; margin:20px 0 8px; }
  p { font-size:14px; line-height:1.5; color:#6b6b66; margin:0 0 24px; }
  button { font:inherit; font-weight:600; color:#fff; background:#2563eb; border:0; border-radius:10px; padding:12px 28px; }
</style>
</head>
<body>
  <div class="box">
    <img src="icon-192.png" alt="" />
    <h1>No internet connection</h1>
    <p>TaskFlow needs the internet. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.href='https://taskflow.triloautomation.com/'">Try again</button>
  </div>
</body>
</html>
