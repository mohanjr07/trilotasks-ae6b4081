# ─────────────────────────────────────────────────────────────────────────────
#  build-windows-exe.yml
#  Builds the TaskFlow Windows installer (.exe) and uploads it as a
#  downloadable workflow artifact (no GitHub Release, no storage bloat).
#
#  Triggers:
#    • Manually from GitHub → Actions tab → "Build Windows"
#    • Automatically when a commit lands on main that touches app code.
#
#  How to get the build:
#    1. Go to Actions → "Build Windows" → click the latest run.
#    2. Scroll to "Artifacts" at the bottom → download TaskFlow-Windows.
#    3. Unzip → run TaskFlow-Setup-x.y.z.exe.
#
#  Artifact retention: 7 days (saves Actions storage quota).
# ─────────────────────────────────────────────────────────────────────────────

name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "src/**"
      - "vite.config.ts"
      - "index.html"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows .exe
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Windows
          path: release/*.exe
          retention-days: 7
          if-no-files-found: error
