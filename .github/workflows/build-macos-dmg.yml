# ─────────────────────────────────────────────────────────────────────────────
#  build-macos-dmg.yml
#  Builds the TaskFlow macOS installer (.dmg) and publishes it to a GitHub
#  Release so installed Mac copies can detect updates.
#
#  Mac auto-update caveat:
#    Without an Apple Developer ID we can't sign/notarize, so electron-updater
#    can't apply updates silently. The app detects a new release and opens the
#    GitHub Releases page in the user's browser to download the new .dmg.
#
#  How a release happens:
#    1. Bump "version" in package.json and push to main.
#    2. This workflow creates the vX.Y.Z tag (if missing), builds .dmg + .zip
#       for x64 and arm64, uploads them + latest-mac.yml to the Release.
#    3. Installed Macs check the Releases endpoint, see the new version,
#       and prompt the user to download.
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Publish macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "src/**"
      - "vite.config.ts"
      - "index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for tag creation

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create & push version tag (if missing)
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — skipping."
          else
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name  "github-actions[bot]"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build & publish macOS .dmg + .zip to GitHub Releases
        run: npm run electron:publish:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
