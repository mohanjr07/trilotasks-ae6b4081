# ─────────────────────────────────────────────────────────────────────────────
#  build-windows-exe.yml
#  Builds the TaskFlow Windows installer (.exe) and publishes it to a
#  GitHub Release so installed apps can auto-update via electron-updater.
#
#  How a release happens:
#    1. Bump "version" in package.json (e.g. 1.0.3 → 1.0.4) and push to main.
#    2. This workflow reads the version, creates a git tag vX.Y.Z if missing,
#       builds the .exe, and uploads it + latest.yml to the GitHub Release.
#    3. Every installed TaskFlow checks the Releases endpoint, sees the
#       new version, prompts the user to download and restart.
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Publish Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "src/**"
      - "vite.config.ts"
      - "index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for tag creation

      - name: Read version from package.json
        id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create & push version tag (if missing)
        shell: bash
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — skipping."
          else
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name  "github-actions[bot]"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build & publish Windows .exe to GitHub Releases
        run: npm run electron:publish
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
