# ─────────────────────────────────────────────────────────────────────────────
#  build-macos-dmg.yml
#  Builds the TaskFlow macOS installer (.dmg) and uploads it as a
#  downloadable workflow artifact (no GitHub Release, no storage bloat).
#
#  Triggers:
#    • Manually from GitHub → Actions tab → "Build macOS"
#    • Automatically when a commit lands on main that touches app code.
#
#  How to get the build:
#    1. Go to Actions → "Build macOS" → click the latest run.
#    2. Scroll to "Artifacts" at the bottom → download TaskFlow-macOS.
#    3. Unzip → open the .dmg → drag TaskFlow into Applications.
#
#  Artifact retention: 7 days (saves Actions storage quota).
#
#  Note on macOS runner minutes: GitHub's free tier counts macOS minutes
#  at 10× Linux (2000 free Linux min ≈ 200 macOS min). Trigger manually
#  when you need a distribution build rather than on every push.
# ─────────────────────────────────────────────────────────────────────────────

name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "src/**"
      - "vite.config.ts"
      - "index.html"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build macOS .dmg
        run: npm run electron:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-macOS
          path: release/*.dmg
          retention-days: 7
          if-no-files-found: error
